name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: ./scripts/test.sh

      - name: Docker build
        run: docker build -t rythm .

      - name: Docker run
        run: docker run -d --name rythm -e PORT=8080 -p 8901:8080 rythm

      - name: Check Docker endpoints
        run: |
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8901/
          curl --fail http://localhost:8901/healthz

      - name: Show container logs
        if: failure()
        run: |
          docker ps -a
          docker logs rythm

      - name: Remove container
        if: always()
        run: docker rm --force rythm
