name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Docker build
        run: docker build -t rythm .

      - name: Docker run
        run: docker run -d -p 8901:80 rythm

      - name: Check docker
        run: curl --fail \
             --retry 10 \
             --retry-delay 1 \
             --retry-all-errors \
             http://localhost:8901

      - name: failed logs
        if: failure()
        run: |
             docker ps -a
             docker log rythm

